<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мероприятия — CosmoSpherum</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<video autoplay muted loop playsinline id="main-bg-video">
  <source src="video/contacts-bg.mp4" type="video/mp4">
</video>
<header class="main-header">
  <div class="logo">CosmoSpherum</div>
  <nav class="nav-menu">
    <a href="index.html" class="nav-link">Главная</a>
    <a href="events.html" class="nav-link active">Мероприятия</a>
    <a href="discounts.html" class="nav-link">Скидки и акции</a>
    <a href="contacts.html" class="nav-link">О нас</a>
    <span class="user-info" id="auth-block"><a href="login.html" class="nav-link" id="login-link">Войти</a></span>
  </nav>
</header>
<main class="container">
  <h1 style="text-align:center; color:var(--gold); margin:30px 0;">Наши программы</h1>
  <div class="events-grid" id="events-list"></div>
  <div class="modal" id="booking-modal">
    <div class="modal-content">
      <span class="close-btn" id="close-booking">&times;</span>
      <h2 id="booking-title"></h2>
      <hr class="form-divider">
      <form id="booking-form">
        <div class="form-group session-group">
          <label>Выбранный сеанс</label>
          <div id="session-display" class="session-box"></div>
        </div>
        <div class="form-group">
          <label>Количество билетов</label>
          <input type="number" id="tickets-count" min="1" max="5" value="1" required>
        </div>
        <div id="booking-price" style="margin:15px 0; font-size:18px;"></div>
        <button type="submit" class="btn submit-booking" id="submit-booking">Забронировать</button>
        <p id="booking-msg" class="error-msg"></p>
      </form>
    </div>
  </div>
</main>
<footer class="site-footer">
  <span>© 2026 CosmoSpherum. Все права защищены.</span>
  <span>г. Саранск, ул. Космонавтов, 11А</span>
  <span>Пн–Пт 12:00–21:00, Сб–Вс 10:00–23:00</span>
  <a href="mailto:infocosmospherum@gmail.com">infocosmospherum@gmail.com</a>
</footer>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script src="js/events.js"></script>
</body>
</html>
